                                    {label: 'UI 렌더링 오류', count: 24, w: '38%', color: 'bg-orange-500'},
                                    {label: 'API 연동 오류', count: 18, w: '30%', color: 'bg-yellow-500'},
                                    {label: '기타', count: 15, w: '25%', color: 'bg-slate-400'}
                                ].map((item, idx) => (
                                    <div key={idx} className="flex items-center text-sm">
                                        <div className="w-32 text-slate-600">{item.label}</div>
                                        <div className="flex-1 bg-slate-100 rounded h-5 overflow-hidden flex">
                                            <div className={`${item.color} h-full rounded-r`} style={{width: item.w}}></div>
                                        </div>
                                        <div className="w-12 text-right text-slate-500">{item.count}건</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 도넛 차트 */}
                        <div className="bg-white border border-slate-200 rounded-lg p-6 shadow-sm flex items-center justify-center">
                            <div className="donut-chart w-56 h-56 relative shadow-sm">
                                <div className="donut-inner w-32 h-32 absolute">
                                    <div className="text-2xl font-bold text-slate-800">178건</div>
                                    <div className="text-xs text-slate-500 mt-1">총 오류</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 업체별 TOP 5 현황 테이블 */}
                    <div className="grid grid-cols-1 gap-6 mb-8">
                        <div className="bg-white border border-slate-200 rounded-lg p-6 shadow-sm">
                            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center border-l-4 border-blue-600 pl-3">
                                B. 오류 건수 높은 업체 TOP 5 <span className="ml-2 px-2 py-0.5 bg-red-50 text-red-600 text-[10px] rounded-full">이번달 기준</span>
                            </h3>
                            <table className="w-full text-left text-sm border-t border-slate-200">
                                <thead className="bg-slate-50 text-slate-500">
                                    <tr>
                                        <th className="px-4 py-3 font-medium">순위</th>
                                        <th className="px-4 py-3 font-medium">업체명</th>
                                        <th className="px-4 py-3 font-medium">오류 건수</th>
                                        <th className="px-4 py-3 font-medium">전월 대비</th>
                                        <th className="px-4 py-3 font-medium w-1/3">주요 오류 유형</th>
                                        <th className="px-4 py-3 font-medium">조치 현황</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    <tr className="hover:bg-slate-50">
                                        <td className="px-4 py-3 text-slate-500">1위</td>
                                        <td className="px-4 py-3 font-medium text-slate-800">A대학교</td>
                                        <td className="px-4 py-3 font-bold text-slate-700">47건</td>
                                        <td className="px-4 py-3 font-bold text-red-500">+12</td>
                                        <td className="px-4 py-3"><div className="flex items-center"><span className="px-2 py-0.5 bg-blue-100 text-blue-700 text-[10px] rounded mr-2 w-16 text-center">세션 오류</span><div className="flex-1 bg-slate-100 h-2.5 rounded-full"><div className="bg-blue-600 h-full rounded-full" style={{width: '70%'}}></div></div></div></td>
                                        <td className="px-4 py-3"><span className="px-2 py-1 bg-amber-50 text-amber-700 text-[10px] font-bold rounded-full">처리중</span></td>
                                    </tr>
                                    <tr className="hover:bg-slate-50">
                                        <td className="px-4 py-3 text-slate-500">2위</td>
                                        <td className="px-4 py-3 font-medium text-slate-800">B전문대</td>
                                        <td className="px-4 py-3 font-bold text-slate-700">38건</td>
                                        <td className="px-4 py-3 font-bold text-red-500">+5</td>
                                        <td className="px-4 py-3"><div className="flex items-center"><span className="px-2 py-0.5 bg-blue-100 text-blue-700 text-[10px] rounded mr-2 w-16 text-center">파일 업로드</span><div className="flex-1 bg-slate-100 h-2.5 rounded-full"><div className="bg-blue-500 h-full rounded-full" style={{width: '55%'}}></div></div></div></td>
                                        <td className="px-4 py-3"><span className="px-2 py-1 bg-green-50 text-green-700 text-[10px] font-bold rounded-full">처리완료</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            // ==========================================
            // 메인 렌더링 영역 (GNB & Main)
            // ==========================================
            return (
                <div className="min-h-screen bg-white font-sans text-slate-900 flex flex-col">
                    {/* Header GNB */}
                    <header className="h-16 bg-slate-800 text-white flex items-center px-6 justify-between shrink-0 shadow-md relative z-20">
                        <div className="flex items-center space-x-8">
                            <h1 className="text-lg font-bold flex items-center">
                                내부 업무 요청 게시판 <span className="ml-3 px-2 py-0.5 bg-blue-500/30 text-blue-200 text-[10px] rounded">v1.2</span>
                            </h1>
                            <nav className="hidden md:flex space-x-2">
                                <button onClick={() => setView('list')} className={`px-4 py-2 rounded-md text-sm font-medium transition ${view === 'list' || view === 'folder_detail' || view === 'task_form' || view === 'note_create' || view === 'note_detail' ? 'bg-blue-600 shadow-inner' : 'text-slate-300 hover:bg-slate-700'}`}>작업폴더 (게시판)</button>
                                <button onClick={() => setView('my_tasks')} className={`px-4 py-2 rounded-md text-sm font-medium transition ${view === 'my_tasks' ? 'bg-blue-600 shadow-inner' : 'text-slate-300 hover:bg-slate-700'}`}>나의 작업</button>
                                <button onClick={() => setView('dashboard')} className={`px-4 py-2 rounded-md text-sm font-medium transition ${view === 'dashboard' ? 'bg-blue-600 shadow-inner' : 'text-slate-300 hover:bg-slate-700'}`}>통계/리포트</button>
                            </nav>
                        </div>
                        <div className="flex items-center space-x-4">
                            <div className="text-xs text-slate-300 mr-2 border-r border-slate-600 pr-4">김개발 님</div>
                            <div className="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-sm font-bold shadow-inner cursor-pointer hover:bg-blue-400 transition">K</div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-auto bg-slate-50 relative">
                        {view === 'list' && <FolderListView />}
                        {view === 'similar_search' && <SimilarSearchView />}
                        {view === 'folder_detail' && <FolderDetailView />}
                        {view === 'task_form' && <TaskNoteFormView />}
                        {view === 'note_create' && <NoteCreateView />}
                        {view === 'note_detail' && <NoteDetailView />}
                        {view === 'my_tasks' && <MyTasksView />}
                        {view === 'dashboard' && <DashboardView />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InternalRequestBoard />);
    </script>
</body>
</html>
