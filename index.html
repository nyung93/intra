<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부 업무 요청 게시판 (Intranet SPA)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind Config for Intranet Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        intra: {
                            bg: '#eef5f9',
                            text: '#455a64',
                            primary: '#1e88e5',
                            primaryDark: '#1565c0',
                            border: '#dae4ec',
                            mint: '#26c6da',
                            orange: '#ff6200',
                            tableHead: '#f1f8fc'
                        }
                    },
                    fontFamily: {
                        sans: ['"Malgun Gothic"', 'Pretendard', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Malgun Gothic', 'Pretendard', sans-serif !important;
            background-color: #eef5f9;
            color: #455a64;
            letter-spacing: -0.5px;
            overflow: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .chart-container {
            position: relative;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- Chosen Palette: Intranet Blue (#1e88e5, #eef5f9, #455a64) -->
    <!-- Application Structure Plan: The SPA now includes a master-detail accordion in the folder list and a split-pane layout for task editing (Left: Request, Right: Developer Input). Task lists have been updated with new specific columns (University, Request Type, Periods, Estimated/Actual times). The status workflow has been streamlined with new color coding (Yellow, Red, Blue, Gray). -->
    <!-- Visualization & Content Choices: 
         - Accordion Folder List: HTML Table Row toggling (Goal: Organize). Allows drilling down into sub-notes without leaving the context of the folder list.
         - Split Pane Note Editor: Flexbox layout (Goal: Change/Compare). Allows developers to read the request and write their response simultaneously.
         - Dynamic Status Dropdown: Select element (Goal: Change). Allows immediate status updates. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. All icons are Unicode. -->

    <div id="app" class="h-screen w-full flex flex-col font-sans bg-intra-bg overflow-hidden"></div>

    <script>
        // --- 1. State Management ---
        const state = {
            view: 'list', // 'list', 'similar_search', 'folder_detail', 'task_form', 'note_create', 'note_detail', 'my_tasks', 'dashboard', 'note_split_view'
            activeMenu: '작업목록조회', 
            showFr01Panel: false,
            expandedFolderId: null, // Tracks which folder row is open
            createTab: 'cause', 
            detailTab: 'answer', 
            answerType: 'tech',
            solutionTab: '1안',
            taskFilter: '전체',
            dateFilter: '이번달',
            folderFilter: '전체'
        };

        // --- 2. Helper Functions ---
        const getStatusStyle = (status) => {
            switch(status) {
                case '검토중': return 'bg-yellow-100 text-yellow-700 border border-yellow-200';
                case '작업중': return 'bg-red-100 text-red-700 border border-red-200';
                case '검수중': return 'bg-blue-100 text-intra-primary border border-blue-200';
                case '작업완료': return 'bg-gray-200 text-gray-700 border border-gray-300';
                default: return 'bg-gray-100 text-gray-600 border border-gray-200';
            }
        };

        // --- 3. Mock Data ---
        const MOCK_FOLDERS = [
            { 
                id: 'F-001', title: '[로그인] 세션 만료 오류 수정 요청', type: '오류수정', date: '2026-04-18', author: '김개발', status: '작업중', univ: 'A대학',
                notes: [
                    { id: 'N-001-1', title: '세션 만료 예외 처리 로직 추가', est: '2h', actual: '2.5h', status: '작업중', assignee: '김개발' },
                    { id: 'N-001-2', title: '로그인 화면 UI 타임아웃 팝업 연동', est: '1h', actual: '-', status: '검토중', assignee: '이프론트' }
                ]
            },
            { 
                id: 'F-002', title: '[매출현황] 월별 집계 기능 개선 요청', type: '기능개선', date: '2026-04-17', author: '이기획', status: '작업완료', univ: 'B대학',
                notes: [
                    { id: 'N-002-1', title: '월별 집계 쿼리 튜닝 및 인덱스 추가', est: '4h', actual: '3h', status: '작업완료', assignee: '박디비' }
                ]
            },
            { 
                id: 'F-003', title: '[회원관리] 신규 탈퇴 사유 항목 추가', type: '신규구축', date: '2026-04-16', author: '박운영', status: '검토중', univ: 'C대학',
                notes: []
            },
            { 
                id: 'F-004', title: '[공통모듈] 날짜 포맷 변경 요청', type: '공통변경', date: '2026-04-15', author: '최개발', status: '검수중', univ: 'A대학',
                notes: [
                    { id: 'N-004-1', title: 'DateUtil 공통 모듈 정규식 패치', est: '2h', actual: '2h', status: '검수중', assignee: '최개발' }
                ]
            },
        ];

        const MOCK_MY_TASKS = [
            { id: 'N-001-1', title: '[로그인] 세션 만료 예외 처리', univ: 'A대학', type: '오류수정', period: '04-18 ~ 04-21', estTime: '3h', actTime: '3.5h', author: '김개발', status: '작업중' },
            { id: 'N-102-3', title: '[수강신청] 취소버튼 500 오류', univ: 'B대학', type: '오류수정', period: '04-17 ~ 04-20', estTime: '2h', actTime: '1h', author: '김개발', status: '검수중' },
            { id: 'N-204-1', title: '[성적조회] PDF 출력 레이아웃', univ: 'A대학', type: '기능개선', period: '04-15 ~ 04-18', estTime: '8h', actTime: '8h', author: '김개발', status: '작업완료' },
            { id: 'N-305-2', title: '[공지사항] 첨부파일 업로드 오류', univ: 'C대학', type: '오류수정', period: '04-14 ~ 04-17', estTime: '4h', actTime: '5h', author: '김개발', status: '작업중' },
            { id: 'N-099-1', title: '[대시보드] KPI 위젯 신규 추가', univ: '전체', type: '신규구축', period: '04-10 ~ 04-25', estTime: '16h', actTime: '-', author: '김개발', status: '검토중' },
        ];

        let barChartInstance = null;
        let donutChartInstance = null;

        // --- 4. View Builders ---

        const getBadge = (code) => `<span class="inline-flex items-center px-2 py-0.5 rounded-[8px] text-[11px] font-bold bg-[#e8f0fe] text-intra-primary ml-2 border border-[#b8d4fe]">FR-${code}</span>`;

        const buildHeader = () => `
            <header class="h-16 bg-intra-primary text-white flex items-center px-6 justify-between shrink-0 shadow-sm relative z-30">
                <div class="flex items-center space-x-8">
                    <h1 class="text-lg font-bold flex items-center tracking-tight cursor-pointer" data-action="nav" data-view="list" data-menu="작업목록조회">
                        📋 내부 업무 요청 게시판 <span class="ml-3 px-2 py-0.5 bg-white/20 text-white text-[10px] rounded">v1.4</span>
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-sm font-bold text-white/90 mr-2 border-r border-white/30 pr-4">👤 김개발 님</div>
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-sm font-bold shadow-none cursor-pointer hover:bg-white/30 transition">K</div>
                </div>
            </header>
        `;

        const buildSidebar = () => `
            <aside class="w-64 bg-white border-r border-intra-border flex flex-col shrink-0 overflow-y-auto relative z-20">
                <div class="p-4 border-b border-intra-border/50">
                    <h2 class="text-xs font-bold text-intra-text/50 mb-3 tracking-wider ml-2">MYBOX</h2>
                    <ul class="space-y-1">
                        <li>
                            <button data-action="nav" data-view="list" data-menu="작업목록조회" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === '작업목록조회' ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                📁 전체 #작업목록조회
                            </button>
                        </li>
                        <li>
                            <button data-action="nav" data-view="my_tasks" data-menu="마이페이지" class="w-full flex flex-col items-start px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === '마이페이지' ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                <div class="flex items-center">
                                    👤 전체 #마이페이지
                                </div>
                                <span class="text-[10px] mt-1.5 ml-6 text-left ${state.activeMenu === '마이페이지' ? 'text-intra-primary/70' : 'text-intra-text/50'}">내가 등록/할당된 내역</span>
                            </button>
                        </li>
                        <li>
                            <button data-action="nav" data-view="dashboard" data-menu="작업피드" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === '작업피드' ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                📊 전체 #내 작업피드
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="p-4">
                    <div class="flex justify-between items-center mb-3 ml-2 pr-2">
                        <h2 class="text-xs font-bold text-intra-text/50 tracking-wider">대학별 폴더</h2>
                        <span class="text-intra-text/50 cursor-pointer hover:text-intra-primary" title="폴더 추가">➕</span>
                    </div>
                    <ul class="space-y-1">
                        ${['A대학', 'B대학', 'C대학'].map(uni => `
                            <li>
                                <button data-action="nav" data-view="list" data-menu="${uni}" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === uni ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                    <div class="w-1.5 h-1.5 rounded-full mr-3 ${state.activeMenu === uni ? 'bg-intra-primary' : 'bg-intra-border'}"></div>
                                    ${uni}
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            </aside>
        `;

        const buildListView = () => {
            const isUnivFilter = ['A대학', 'B대학', 'C대학'].includes(state.activeMenu);
            const filteredList = isUnivFilter ? MOCK_FOLDERS.filter(f => f.univ === state.activeMenu) : MOCK_FOLDERS;

            return `
                <div class="flex flex-col h-full relative">
                    <div class="p-6 flex-1 pb-32 overflow-y-auto">
                        <div class="mb-4">
                            <h2 class="text-xl font-bold text-intra-text mb-2">작업폴더 및 노트 목록</h2>
                            <p class="text-sm text-intra-text/80">ℹ️ 작업폴더를 클릭하면 하위에 등록된 작업노트 목록이 아코디언 형태로 펼쳐집니다. 작업노트를 클릭하여 상세 내역을 입력하세요.</p>
                        </div>
                        <div class="bg-white rounded-[5px] shadow-none border border-intra-border p-4 mb-6 flex items-center space-x-4">
                            <div class="flex-1 relative flex items-center border border-intra-border rounded-[5px] px-3 bg-white focus-within:ring-1 focus-within:ring-intra-primary focus-within:border-intra-primary">
                                <span class="text-intra-text/50 text-sm">🔍</span>
                                <input type="text" placeholder="요청 내용으로 검색..." class="w-full pl-2 py-2 outline-none text-sm bg-transparent" />
                            </div>
                            <button class="px-6 py-2 bg-intra-primary text-white rounded-[5px] font-medium hover:bg-intra-primaryDark transition text-sm">검색</button>
                            <button data-action="toggle" data-key="showFr01Panel" data-val="true" class="px-6 py-2 bg-intra-mint text-white rounded-[5px] font-medium hover:bg-[#1eb7cb] flex items-center transition text-sm">
                                ➕ 새 폴더 등록
                            </button>
                        </div>

                        <div class="bg-white rounded-[5px] shadow-none border border-intra-border overflow-hidden">
                            <div class="bg-gray-50 border-b border-intra-border px-4 py-3 flex items-center justify-between">
                                <h3 class="font-bold text-intra-text flex items-center">
                                    ${isUnivFilter ? `[${state.activeMenu}] 소속 작업목록` : '전체 작업목록'}
                                    <span class="ml-2 bg-white px-2 py-0.5 rounded border border-intra-border text-intra-primary text-xs">${filteredList.length}건</span>
                                </h3>
                            </div>
                            <table class="w-full text-left text-sm">
                                <thead class="bg-intra-tableHead text-intra-text border-b border-intra-border">
                                <tr>
                                    <th class="px-6 py-3 font-medium text-center border-r border-white w-16">No.</th>
                                    <th class="px-6 py-3 font-medium border-r border-white">폴더 타이틀</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center w-24">대학 구분</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center w-24">요청 유형</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center w-32">요청일</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center w-24">담당자</th>
                                    <th class="px-6 py-3 font-medium text-center w-24">상태</th>
                                </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                ${filteredList.length > 0 ? filteredList.map((f) => `
                                    <tr data-action="toggleFolder" data-id="${f.id}" class="hover:bg-[#f1f8fc] cursor-pointer transition ${state.expandedFolderId === f.id ? 'bg-[#f1f8fc]' : ''}">
                                        <td class="px-6 py-4 text-intra-text/60 text-center font-mono">${f.id}</td>
                                        <td class="px-6 py-4 font-bold text-intra-primary flex items-center">
                                            <span class="mr-2">${state.expandedFolderId === f.id ? '📂' : '📁'}</span> ${f.title}
                                        </td>
                                        <td class="px-6 py-4 text-center text-intra-text/80 text-xs">${f.univ}</td>
                                        <td class="px-6 py-4 text-center"><span class="px-2 py-1 bg-gray-100 text-intra-text rounded-[5px] text-xs">${f.type}</span></td>
                                        <td class="px-6 py-4 text-intra-text/70 text-center">${f.date}</td>
                                        <td class="px-6 py-4 text-intra-text text-center">${f.author}</td>
                                        <td class="px-6 py-4 text-center">
                                            <span class="px-2 py-1 rounded-[5px] text-xs font-bold ${getStatusStyle(f.status)}">${f.status}</span>
                                        </td>
                                    </tr>
                                    ${state.expandedFolderId === f.id ? `
                                    <tr class="bg-intra-bg border-b-2 border-intra-primary/30">
                                        <td colspan="7" class="p-6">
                                            <div class="bg-white border border-intra-border rounded-[5px] shadow-sm overflow-hidden">
                                                <div class="bg-gray-50 px-4 py-2 border-b border-intra-border flex justify-between items-center">
                                                    <h4 class="font-bold text-intra-text text-sm flex items-center">↳ 하위 작업노트 목록</h4>
                                                    <button class="text-xs bg-white border border-intra-border px-2 py-1 rounded hover:bg-gray-100 transition">+ 노트 추가</button>
                                                </div>
                                                ${f.notes && f.notes.length > 0 ? `
                                                <table class="w-full text-xs text-left">
                                                    <thead class="bg-white border-b border-intra-border text-intra-text/70">
                                                        <tr>
                                                            <th class="py-2 px-4 font-medium">노트 ID</th>
                                                            <th class="py-2 px-4 font-medium">제목</th>
                                                            <th class="py-2 px-4 font-medium text-center">예상 공수</th>
                                                            <th class="py-2 px-4 font-medium text-center">실제 공수</th>
                                                            <th class="py-2 px-4 font-medium text-center">담당자</th>
                                                            <th class="py-2 px-4 font-medium text-center">상태</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody class="divide-y divide-gray-100">
                                                        ${f.notes.map(n => `
                                                            <tr class="hover:bg-blue-50 cursor-pointer transition group" data-action="nav" data-view="note_split_view">
                                                                <td class="py-3 px-4 font-mono text-intra-primary group-hover:underline">${n.id}</td>
                                                                <td class="py-3 px-4 font-bold">${n.title}</td>
                                                                <td class="py-3 px-4 text-center text-intra-text/70">${n.est}</td>
                                                                <td class="py-3 px-4 text-center font-bold">${n.actual}</td>
                                                                <td class="py-3 px-4 text-center">${n.assignee}</td>
                                                                <td class="py-3 px-4 text-center">
                                                                    <span class="px-2 py-0.5 rounded-[3px] text-[10px] font-bold ${getStatusStyle(n.status)}">${n.status}</span>
                                                                </td>
                                                            </tr>
                                                        `).join('')}
                                                    </tbody>
                                                </table>
                                                ` : `<div class="p-4 text-center text-sm text-intra-text/50">등록된 하위 작업노트가 없습니다.</div>`}
                                            </div>
                                        </td>
                                    </tr>
                                    ` : ''}
                                `).join('') : `<tr><td colspan="7" class="px-6 py-12 text-center text-intra-text/50">조회된 내역이 없습니다.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Bottom Panel: FR-01 -->
                    <div class="absolute bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.1)] border-t border-intra-border transform transition-transform z-20 ${state.showFr01Panel ? 'translate-y-0' : 'translate-y-full'}" style="transition: transform 0.3s ease;">
                        <div class="bg-intra-primary text-white px-6 py-3 flex justify-between items-center">
                            <h3 class="font-medium flex items-center">✨ 자동 타이틀 생성 미리보기</h3>
                            ${getBadge('01')}
                        </div>
                        <div class="p-6">
                            <label class="block text-sm text-intra-text mb-2">요청 내용 입력</label>
                            <textarea class="w-full border border-intra-border rounded-[5px] p-3 text-sm focus:ring-1 focus:ring-intra-primary outline-none mb-4 h-20">로그인 화면에서 세션 만료 후 새로고침 시 오류 페이지로 이동되는 문제 발생</textarea>
                            
                            <label class="block text-sm text-intra-text mb-2">AI 자동 생성 타이틀 후보</label>
                            <div class="flex space-x-6 mb-6">
                                <label class="flex items-center space-x-2 cursor-pointer">
                                    <input type="radio" name="title" checked class="w-4 h-4 text-intra-primary focus:ring-intra-primary" />
                                    <span class="text-intra-text font-bold">[로그인] 세션 만료 후 새로고침 오류 수정</span>
                                </label>
                            </div>
                            
                            <div class="flex space-x-3">
                                <button data-action="navAndClosePanel" data-view="similar_search" class="px-6 py-2.5 bg-intra-primary text-white rounded-[5px] font-medium hover:bg-intra-primaryDark transition text-sm">이 타이틀로 확정</button>
                                <button data-action="toggle" data-key="showFr01Panel" data-val="false" class="px-6 py-2.5 border border-intra-border text-intra-text rounded-[5px] hover:bg-gray-50 transition text-sm">취소</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        // --- NEW VIEW: SPLIT PANE FOR NOTE EDITING ---
        const buildNoteSplitView = () => `
            <div class="flex h-full w-full bg-intra-bg">
                
                <!-- Left Pane: Request Information -->
                <div class="w-1/2 p-6 overflow-y-auto border-r border-intra-border bg-white flex flex-col">
                    <div class="flex items-center text-sm text-intra-text/70 mb-4 shrink-0">
                        <span class="cursor-pointer hover:text-intra-primary" data-action="nav" data-view="list">작업폴더 목록</span> ❯

            const donutCtx = document.getElementById('donutChart');

            if (barCtx) {
                barChartInstance = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: ['세션/인증 오류', '파일 업로드 오류', 'DB 조회 오류', 'UI 렌더링 오류', 'API 연동 오류'],

                            label: '오류 건수',
                            data: [52, 38, 31, 24, 18],

                        }]
                    },
                    options: { indexAxis: 'y', maintainAspectRatio: false, responsive: true, plugins: { legend: { display: false } } }
                });
            }

            if (donutCtx) {
                donutChartInstance = new Chart(donutCtx, {
                    type: 'doughnut',

                        labels: ['세션/인증', '파일업로드', 'DB/인프라', '기타'],
                        datasets: [{
                            data: [52, 38, 31, 57],
                            backgroundColor: ['#1e88e5', '#60a5fa', '#26c6da', '#ff6200']
                        }]

                    options: { maintainAspectRatio: false, responsive: true, cutout: '70%', plugins: { legend: { position: 'bottom' } } }
                });
            }
        };

        // --- 7. Event Delegation ---
        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;

            const action = btn.dataset.action;
            
            if (action === 'nav') {
                state.view = btn.dataset.view;
                if (btn.dataset.menu) state.activeMenu = btn.dataset.menu;
                render();
            } else if (action === 'navAndClosePanel') {
                state.view = btn.dataset.view;
                state.showFr01Panel = false;
                render();
            } else if (action === 'toggle') {
                state[btn.dataset.key] = btn.dataset.val === 'true';
                render();
            } else if (action === 'set') {
                state[btn.dataset.key] = btn.dataset.val;
                render();
            } else if (action === 'toggleFolder') {
                const folderId = btn.dataset.id;
                state.expandedFolderId = state.expandedFolderId === folderId ? null : folderId;
                render();
            }
        });
