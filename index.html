<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부 업무 요청 게시판 (Intranet SPA)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind Config for Intranet Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        intra: {
                            bg: '#eef5f9',
                            text: '#455a64',
                            primary: '#1e88e5',
                            primaryDark: '#1565c0',
                            border: '#dae4ec',
                            mint: '#26c6da',
                            orange: '#ff6200',
                            tableHead: '#f1f8fc'
                        }
                    },
                    fontFamily: {
                        sans: ['"Malgun Gothic"', 'Pretendard', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Malgun Gothic', 'Pretendard', sans-serif !important;
            background-color: #eef5f9;
            color: #455a64;
            letter-spacing: -0.5px;
            overflow: hidden; /* Prevent body scroll, manage scroll inside layout */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Chart Container Requirements */
        .chart-container {
            position: relative;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- Chosen Palette: Intranet Blue (#1e88e5, #eef5f9, #455a64) -->
    <!-- Application Structure Plan: The SPA is structured into a 2-column Intranet layout (LNB + Main Content). It translates the functional specification into 8 specific views tailored to the workflow (List -> Similar Search -> Detail -> Note Form -> Note Create -> Note Detail), plus a personal dashboard (My Tasks) and a global analytics dashboard. The structure optimizes for task-oriented exploration rather than a document layout. -->
    <!-- Visualization & Content Choices: 
         - Folder List/Tasks: Data Tables (Goal: Organize/Inform). Allows quick scanning and filtering of status.
         - My Tasks Progress: HTML/CSS Progress Bars (Goal: Inform). Visualizes task completion percentage effectively.
         - Dashboard Error Types: Chart.js Horizontal Bar Chart (Goal: Compare). Clearly compares error frequencies.
         - Dashboard Total Errors: Chart.js Doughnut Chart (Goal: Proportions). Visualizes the total sum with proportions.
         - Tab Interfaces: Vanilla JS DOM updates (Goal: Change). Allows seamless switching without reloading. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. All icons are Unicode. -->

    <div id="app" class="h-screen w-full flex flex-col font-sans bg-intra-bg overflow-hidden"></div>

    <script>
        // --- 1. State Management ---
        const state = {
            view: 'list', // 'list', 'similar_search', 'folder_detail', 'task_form', 'note_create', 'note_detail', 'my_tasks', 'dashboard'
            activeMenu: '작업목록조회', 
            showFr01Panel: false,
            createTab: 'cause', 
            detailTab: 'answer', 
            answerType: 'tech',
            solutionTab: '1안',
            taskFilter: '전체',
            dateFilter: '이번달',
            folderFilter: '전체'
        };

        // --- 2. Mock Data ---
        const MOCK_FOLDERS = [
            { id: '001', title: '[로그인] 세션 만료 오류 수정 요청', type: '오류수정', date: '2026-04-18', author: '김개발', status: '진행중', univ: 'A대학' },
            { id: '002', title: '[매출현황] 월별 집계 기능 개선 요청', type: '기능개선', date: '2026-04-17', author: '이기획', status: '완료', univ: 'B대학' },
            { id: '003', title: '[회원관리] 신규 탈퇴 사유 항목 추가', type: '신규구축', date: '2026-04-16', author: '박운영', status: '검토중', univ: 'C대학' },
            { id: '004', title: '[공통모듈] 날짜 포맷 변경 요청', type: '공통변경', date: '2026-04-15', author: '최개발', status: '대기', univ: 'A대학' },
            { id: '005', title: '[대시보드] KPI 위젯 오류 수정', type: '오류수정', date: '2026-04-14', author: '김개발', status: '진행중', univ: 'B대학' },
        ];

        const MOCK_MY_TASKS = [
            { id: '001', title: '[로그인] 세션 만료 오류 수정', sys: '통합포털', date: '04-18', due: '04-21', hours: '6h', status: '진행중', progress: 60, statusColor: 'bg-orange-100 text-intra-orange' },
            { id: '002', title: '[수강신청] 취소버튼 500 오류', sys: '학사시스템', date: '04-17', due: '04-20', hours: '4h', status: '진행중', progress: 30, statusColor: 'bg-orange-100 text-intra-orange' },
            { id: '003', title: '[성적조회] PDF 출력 레이아웃', sys: '학사시스템', date: '04-15', due: '04-18', hours: '3h', status: '완료', progress: 100, statusColor: 'bg-green-100 text-green-700' },
            { id: '004', title: '[공지사항] 첨부파일 업로드 오류', sys: '통합포털', date: '04-14', due: '04-17', hours: '5h', status: '지연', progress: 80, statusColor: 'bg-red-100 text-red-700', isOverdue: true },
            { id: '005', title: '[대시보드] KPI 위젯 미표시', sys: '관리자시스템', date: '04-13', due: '04-16', hours: '2h', status: '완료', progress: 100, statusColor: 'bg-green-100 text-green-700' },
            { id: '006', title: '[회원관리] 탈퇴 사유 항목 추가', sys: 'CRM', date: '04-12', due: '04-20', hours: '8h', status: '진행중', progress: 15, statusColor: 'bg-orange-100 text-intra-orange' },
        ];

        // Global chart instances
        let barChartInstance = null;
        let donutChartInstance = null;

        // --- 3. View Builders ---

        const getBadge = (code) => `<span class="inline-flex items-center px-2 py-0.5 rounded-[8px] text-[11px] font-bold bg-[#e8f0fe] text-intra-primary ml-2 border border-[#b8d4fe]">FR-${code}</span>`;

        const buildHeader = () => `
            <header class="h-16 bg-intra-primary text-white flex items-center px-6 justify-between shrink-0 shadow-sm relative z-30">
                <div class="flex items-center space-x-8">
                    <h1 class="text-lg font-bold flex items-center tracking-tight cursor-pointer" data-action="nav" data-view="list" data-menu="작업목록조회">
                        📋 내부 업무 요청 게시판 <span class="ml-3 px-2 py-0.5 bg-white/20 text-white text-[10px] rounded">v1.3</span>

                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-sm font-bold text-white/90 mr-2 border-r border-white/30 pr-4">👤 김개발 님</div>
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-sm font-bold shadow-none cursor-pointer hover:bg-white/30 transition">K</div>
                </div>
            </header>
        `;

        const buildSidebar = () => `
            <aside class="w-64 bg-white border-r border-intra-border flex flex-col shrink-0 overflow-y-auto relative z-20">
                <div class="p-4 border-b border-intra-border/50">
                    <h2 class="text-xs font-bold text-intra-text/50 mb-3 tracking-wider ml-2">MYBOX</h2>
                    <ul class="space-y-1">
                        <li>
                            <button data-action="nav" data-view="list" data-menu="작업목록조회" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === '작업목록조회' ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">

                            </button>
                        </li>
                        <li>

                                    👤 전체 #마이페이지
                                </div>

                        </li>
                        <li>

                                📊 전체 #내 작업피드
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="p-4">
                    <div class="flex justify-between items-center mb-3 ml-2 pr-2">
                        <h2 class="text-xs font-bold text-intra-text/50 tracking-wider">대학별 폴더</h2>
                        <span class="text-intra-text/50 cursor-pointer hover:text-intra-primary" title="폴더 추가">➕</span>
                    </div>
                    <ul class="space-y-1">
                        ${['A대학', 'B대학', 'C대학'].map(uni => `
                            <li>
                                <button data-action="nav" data-view="list" data-menu="${uni}" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === uni ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                    <div class="w-1.5 h-1.5 rounded-full mr-3 ${state.activeMenu === uni ? 'bg-intra-primary' : 'bg-intra-border'}"></div>
                                    ${uni}
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            </aside>
        `;

        const buildListView = () => {
            const isUnivFilter = ['A대학', 'B대학', 'C대학'].includes(state.activeMenu);
            const filteredList = isUnivFilter ? MOCK_FOLDERS.filter(f => f.univ === state.activeMenu) : MOCK_FOLDERS;

            return `
                <div class="flex flex-col h-full relative">
                    <div class="p-6 flex-1 pb-32 overflow-y-auto">
                        <div class="mb-4">
                            <h2 class="text-xl font-bold text-intra-text mb-2">작업폴더 목록</h2>
                            <p class="text-sm text-intra-text/80">ℹ️ 등록된 작업폴더의 전체 목록을 조회하거나 대학별로 필터링하여 확인합니다. 신규 업무 요청 시 '새 요청 등록' 버튼을 클릭하세요.</p>
                        </div>
                        <div class="bg-white rounded-[5px] shadow-none border border-intra-border p-4 mb-6 flex items-center space-x-4">
                            <div class="flex-1 relative flex items-center border border-intra-border rounded-[5px] px-3 bg-white focus-within:ring-1 focus-within:ring-intra-primary focus-within:border-intra-primary">
                                <span class="text-intra-text/50 text-sm">🔍</span>
                                <input type="text" placeholder="요청 내용으로 검색..." class="w-full pl-2 py-2 outline-none text-sm bg-transparent" />
                            </div>
                            <button class="px-6 py-2 bg-intra-primary text-white rounded-[5px] font-medium hover:bg-intra-primaryDark transition text-sm">검색</button>
                            <button data-action="toggle" data-key="showFr01Panel" data-val="true" class="px-6 py-2 bg-intra-mint text-white rounded-[5px] font-medium hover:bg-[#1eb7cb] flex items-center transition text-sm">
                                ➕ 새 요청 등록
                            </button>
                            <div class="flex bg-[#f2f3f5] p-1 rounded-[5px] ml-4 border border-intra-border">
                                ${['전체', '진행중'].map(f => `
                                    <button data-action="set" data-key="folderFilter" data-val="${f}" class="px-4 py-1.5 text-sm font-medium rounded-[3px] transition ${state.folderFilter === f ? 'bg-white text-intra-primary shadow-sm border border-gray-200' : 'text-intra-text/70 hover:bg-gray-200'}">${f}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white rounded-[5px] shadow-none border border-intra-border overflow-hidden">
                            <div class="bg-gray-50 border-b border-intra-border px-4 py-3 flex items-center justify-between">
                                <h3 class="font-bold text-intra-text flex items-center">
                                    ${isUnivFilter ? `[${state.activeMenu}] 소속 작업목록` : '전체 작업목록'}
                                    <span class="ml-2 bg-white px-2 py-0.5 rounded border border-intra-border text-intra-primary text-xs">${filteredList.length}건</span>
                                </h3>
                            </div>
                            <table class="w-full text-left text-sm">
                                <thead class="bg-intra-tableHead text-intra-text border-b border-intra-border">
                                <tr>
                                    <th class="px-6 py-3 font-medium text-center border-r border-white">No.</th>
                                    <th class="px-6 py-3 font-medium border-r border-white">폴더 타이틀</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center">대학 구분</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center">요청 유형</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center">요청일</th>
                                    <th class="px-6 py-3 font-medium border-r border-white text-center">담당자</th>
                                    <th class="px-6 py-3 font-medium text-center">상태</th>
                                </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                ${filteredList.length > 0 ? filteredList.map((f) => `
                                    <tr data-action="nav" data-view="folder_detail" class="hover:bg-[#f1f8fc] cursor-pointer transition">
                                    <td class="px-6 py-4 text-intra-text/60 text-center">${f.id}</td>
                                    <td class="px-6 py-4 font-bold text-intra-primary">${f.title}</td>
                                    <td class="px-6 py-4 text-center text-intra-text/80 text-xs">${f.univ}</td>
                                    <td class="px-6 py-4 text-center">
                                        <span class="px-2 py-1 bg-gray-100 text-intra-text rounded-[5px] text-xs">${f.type}</span>
                                    </td>
                                    <td class="px-6 py-4 text-intra-text/70 text-center">${f.date}</td>
                                    <td class="px-6 py-4 text-intra-text text-center">${f.author}</td>
                                    <td class="px-6 py-4 text-center">
                                        <span class="px-2 py-1 rounded-[5px] text-xs font-medium ${
                                        f.status === '진행중' ? 'bg-blue-100 text-intra-primary' :
                                        f.status === '완료' ? 'bg-green-100 text-green-700' :
                                        f.status === '검토중' ? 'bg-orange-100 text-intra-orange' : 'bg-gray-100 text-gray-700'
                                        }">${f.status}</span>
                                    </td>
                                    </tr>
                                `).join('') : `<tr><td colspan="7" class="px-6 py-12 text-center text-intra-text/50">조회된 내역이 없습니다.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Bottom Panel: FR-01 -->
                    <div class="absolute bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.1)] border-t border-intra-border transform transition-transform z-20 ${state.showFr01Panel ? 'translate-y-0' : 'translate-y-full'}" style="transition: transform 0.3s ease;">
                        <div class="bg-intra-primary text-white px-6 py-3 flex justify-between items-center">
                            <h3 class="font-medium flex items-center">✨ 자동 타이틀 생성 미리보기</h3>
                            ${getBadge('01')}
                        </div>
                        <div class="p-6">
                            <label class="block text-sm text-intra-text mb-2">요청 내용 입력</label>
                            <textarea class="w-full border border-intra-border rounded-[5px] p-3 text-sm focus:ring-1 focus:ring-intra-primary outline-none mb-4 h-20">로그인 화면에서 세션 만료 후 새로고침 시 오류 페이지로 이동되는 문제 발생</textarea>
                            
                            <label class="block text-sm text-intra-text mb-2">AI 자동 생성 타이틀 후보</label>
                            <div class="flex space-x-6 mb-6">
                                <label class="flex items-center space-x-2 cursor-pointer">
                                    <input type="radio" name="title" checked class="w-4 h-4 text-intra-primary focus:ring-intra-primary" />
                                    <span class="text-intra-text font-bold">[로그인] 세션 만료 후 새로고침 오류 수정</span>

                                <label class="flex items-center space-x-2 cursor-pointer">
                                    <input type="radio" name="title" class="w-4 h-4 text-intra-primary focus:ring-intra-primary" />

        const buildSimilarSearch = () => `

                    <span class="cursor-pointer hover:text-intra-primary" data-action="nav" data-view="list">작업폴더 목록</span> ❯ 
                    <span>신규 요청 등록</span> ❯ 
                    <span class="font-bold text-intra-text">타시스템 적용 검증</span>
                </div>
                
                <p class="mb-6 text-sm text-intra-text/80">ℹ️ 등록하려는 요청이 타 시스템에 이미 적용된 이력이 있는지 자동으로 검증합니다. 기존 작업노트를 참조하여 해결 방안을 빠르게 수립할 수 있습니다.</p>

                <div class="flex items-center mb-4">
                    <h2 class="text-xl font-bold text-intra-text border-l-[3px] border-intra-primary pl-3">유사 요청 자동 탐색 결과</h2>
                    <span class="ml-3 px-2 py-0.5 bg-green-100 text-green-700 rounded-[5px] text-xs font-medium">자동 실행됨</span>
                    ${getBadge('08')}
                </div>

                <div class="bg-[#f1f8fc] border border-[#d6e9f5] rounded-[5px] p-4 mb-6">
                    <div class="flex items-center text-sm mb-2">
                        <span class="text-intra-text mr-3">검색 키워드 :</span>
                        <div class="flex space-x-2">
                            <span class="px-3 py-1 bg-white border border-intra-border text-intra-primary rounded-[8px] text-xs font-bold">#세션 만료</span>
                            <span class="px-3 py-1 bg-white border border-intra-border text-intra-primary rounded-[8px] text-xs font-bold">#로그인 오류</span>
                        </div>
                    </div>
                    <p class="text-sm text-intra-primary font-bold">3건의 유사 요청 이력이 발견되었습니다.</p>
                </div>

                <div class="space-y-4 mb-8">
                    ${[
                        { score: 92, id: 'WRK-0241', sys: '구매관리 시스템', title: '[구매관리] 세션 만료 redirect 오류 수정', date: '2024-11-10' },
                        { score: 87, id: 'WRK-0189', sys: '인사관리 시스템', title: '[인사관리] 로그인 세션 처리 오류', date: '2024-08-22' }
                    ].map(item => `
                    <div class="bg-white border border-intra-border rounded-[5px] p-4 flex items-center justify-between hover:border-intra-primary transition">
                        <div class="flex items-center">
                            <div class="flex flex-col items-center justify-center w-16 border-r border-gray-100 mr-4 pr-4">
                                <span class="text-2xl font-bold text-green-600">${item.score}</span>
                                <span class="text-[10px] text-intra-text/60 mt-1">% 유사도</span>
                            </div>
                            <div>
                                <div class="text-xs text-intra-text/60 mb-1">${item.id} · ${item.sys}</div>
                                <h4 class="text-base font-bold text-intra-primary cursor-pointer">${item.title}</h4>
                            </div>

                                <th class="px-6 py-3 font-medium border-r border-white">작업노트 제목</th>
                                <th class="px-6 py-3 font-medium border-r border-white text-center">완료 예정</th>
                                <th class="px-6 py-3 font-medium border-r border-white text-center">상태</th>
                                <th class="px-6 py-3 font-medium w-48 text-center">진행도</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            ${filteredTasks.map(task => `
                                <tr data-action="nav" data-view="note_detail" class="hover:bg-[#f1f8fc] transition cursor-pointer">
                                    <td class="px-6 py-4 font-bold text-intra-primary">${task.title}</td>
                                    <td class="px-6 py-4 font-bold text-center ${task.isOverdue ? 'text-[#ff6200]' : 'text-intra-text'}">${task.due}</td>
                                    <td class="px-6 py-4 text-center"><span class="px-2 py-1 rounded-[5px] text-[11px] font-bold ${task.statusColor}">${task.status}</span></td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center justify-center space-x-3">
                                            <div class="flex-1 bg-gray-200 rounded-full h-2.5 overflow-hidden">
                                                <div class="h-2.5 rounded-full ${task.progress === 100 ? 'bg-green-600' : task.isOverdue ? 'bg-[#ff6200]' : 'bg-intra-primary'}" style="width: ${task.progress}%"></div>
                                            </div>
                                            <span class="text-xs text-intra-text/70 w-8">${task.progress}%</span>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
        };

        const buildDashboard = () => `
            <div class="p-6 max-w-7xl mx-auto pb-32 overflow-y-auto w-full">
                <div class="mb-4">
                    <h2 class="text-xl font-bold text-intra-text mb-2">통계/현황 조회 대시보드</h2>
                    <p class="text-sm text-intra-text/80">ℹ️ 시스템 전체의 요청 처리 현황(KPI), 자주 발생하는 오류 유형 및 발생 비율을 Chart.js를 이용해 시각화한 관리자용 통계 화면입니다.</p>
                </div>

                <div class="bg-white border border-intra-border rounded-[5px] p-4 mb-6 flex justify-between items-center shadow-none">
                    <div class="flex items-center space-x-4">
                        <span class="text-sm font-bold text-intra-text">조회기간 :</span>
                        <div class="flex bg-white border border-intra-border p-1 rounded-[5px]">
                            ${['오늘', '이번주', '이번달', '3개월'].map(f => `
                                <button data-action="set" data-key="dateFilter" data-val="${f}" class="px-4 py-1 text-sm font-bold rounded-[3px] transition ${state.dateFilter === f ? 'bg-intra-primary text-white' : 'text-intra-text hover:bg-gray-100'}">${f}</button>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-4 mb-6">
                    <div class="bg-white border border-intra-border rounded-[5px] p-5"><div class="text-intra-text text-sm mb-1 font-bold">총 요청 건수</div><div class="text-3xl font-bold text-intra-primary mb-1">247<span class="text-lg text-intra-text/70">건</span></div></div>
                    <div class="bg-white border border-intra-border rounded-[5px] p-5"><div class="text-intra-text text-sm mb-1 font-bold">처리 완료</div><div class="text-3xl font-bold text-green-600 mb-1">198<span class="text-lg text-intra-text/70">건</span></div></div>
                    <div class="bg-white border border-intra-border rounded-[5px] p-5"><div class="text-intra-text text-sm mb-1 font-bold">평균 처리일</div><div class="text-3xl font-bold text-intra-primary mb-1">2.8<span class="text-lg text-intra-text/70">일</span></div></div>
                    <div class="bg-white border border-intra-border rounded-[5px] p-5"><div class="text-intra-text text-sm mb-1 font-bold">지연 건수</div><div class="text-3xl font-bold text-[#ff6200] mb-1">12<span class="text-lg text-intra-text/70">건</span></div></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <!-- Chart Container Requirements Compliant -->
                    <div class="bg-white border border-intra-border rounded-[5px] p-6 shadow-none flex flex-col">
                        <h3 class="text-lg font-bold text-intra-text mb-6 flex items-center border-l-[3px] border-intra-primary pl-3">
                            A. 자주 발생하는 오류 유형 (Bar)
                        </h3>
                        <div class="chart-container flex-1 w-full max-w-xl mx-auto h-[300px] min-h-[300px]">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="bg-white border border-intra-border rounded-[5px] p-6 shadow-none flex flex-col">
                        <h3 class="text-lg font-bold text-intra-text mb-6 flex items-center border-l-[3px] border-intra-primary pl-3">
                            B. 오류 발생 비율 (Doughnut)
                        </h3>
                        <div class="chart-container flex-1 w-full max-w-sm mx-auto h-[300px] min-h-[300px]">
                            <canvas id="donutChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // --- 4. Main Render Function ---
        const render = () => {
            const app = document.getElementById('app');
            
            let mainContent = '';
            switch(state.view) {
                case 'list': mainContent = buildListView(); break;
                case 'similar_search': mainContent = buildSimilarSearch(); break;
                case 'folder_detail': mainContent = buildFolderDetail(); break;
                case 'task_form': mainContent = buildTaskForm(); break;
                case 'note_create': mainContent = buildNoteCreate(); break;
                case 'note_detail': mainContent = buildNoteDetail(); break;
                case 'my_tasks': mainContent = buildMyTasks(); break;
                case 'dashboard': mainContent = buildDashboard(); break;
            }

            app.innerHTML = `
                ${buildHeader()}
                <div class="flex-1 flex overflow-hidden">
                    ${buildSidebar()}
                    <main class="flex-1 overflow-hidden relative bg-intra-bg">
                        ${mainContent}
                    </main>
                </div>
            `;

            // Initialize charts if on dashboard view
            if (state.view === 'dashboard') {
                setTimeout(initCharts, 0); // Wait for DOM injection
            }
        };

        // --- 5. Chart.js Initialization ---
        const initCharts = () => {
            if (barChartInstance) barChartInstance.destroy();
            if (donutChartInstance) donutChartInstance.destroy();

            const barCtx = document.getElementById('barChart');
            const donutCtx = document.getElementById('donutChart');

            if (barCtx) {
                barChartInstance = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: ['세션/인증 오류', '파일 업로드 오류', 'DB 조회 오류', 'UI 렌더링 오류', 'API 연동 오류', '기타'],
                        datasets: [{
                            label: '오류 건수',
                            data: [52, 38, 31, 24, 18, 15],
                            backgroundColor: ['#1e88e5', '#60a5fa', '#26c6da', '#ff6200', '#eab308', '#94a3b8']
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        maintainAspectRatio: false, // CRITICAL for chart-container constraints
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            }

            if (donutCtx) {
                donutChartInstance = new Chart(donutCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['세션/인증', '파일업로드', 'DB/인프라', '기타'],
                        datasets: [{
                            data: [52, 38, 31, 57],
                            backgroundColor: ['#1e88e5', '#60a5fa', '#26c6da', '#ff6200']
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        responsive: true,
                        cutout: '70%',
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }
        };

        // --- 6. Event Delegation (Vanilla JS Interaction Handling) ---
        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;

            const action = btn.dataset.action;
            
            if (action === 'nav') {
                state.view = btn.dataset.view;
                if (btn.dataset.menu) state.activeMenu = btn.dataset.menu;
                render();
            } else if (action === 'navAndClosePanel') {
                state.view = btn.dataset.view;
                state.showFr01Panel = false;
                render();
            } else if (action === 'toggle') {
                state[btn.dataset.key] = btn.dataset.val === 'true';
                render();
            } else if (action === 'set') {
                state[btn.dataset.key] = btn.dataset.val;
                render();
            }
        });

        // Initial Render
        render();

    </script>
</body>
</html>
