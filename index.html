<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부 업무 요청 게시판 프로토타입 v1.1</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX compilation in browser (CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>

<body class="bg-slate-50">
    <div id="root"></div>

        const Code = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>;
        const FileImage = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><circle cx="10" cy="13" r="2"></circle><path d="m20 17-1.09-1.09a2 2 0 0 0-2.82 0L10 22"></path></svg>;
        const ShieldAlert = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>;
        const CheckSquare = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>;
        const UploadCloud = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M12 12v9"></path><path d="m16 16-4-4-4 4"></path></svg>;
        const ArrowRight = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>;
        const AlertTriangle = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>;

        // --- MOCK DATA ---
        const MOCK_FOLDERS = [
            { id: '001', title: '[로그인] 세션 만료 오류 수정 요청', type: '오류수정', date: '2025-04-18', author: '김개발', status: '진행중' },
            { id: '002', title: '[매출현황] 월별 집계 기능 개선 요청', type: '기능개선', date: '2025-04-17', author: '이기획', status: '완료' },
            { id: '003', title: '[회원관리] 신규 탈퇴 사유 항목 추가', type: '신규구축', date: '2025-04-16', author: '박운영', status: '검토중' },
            { id: '004', title: '[공통모듈] 날짜 포맷 변경 요청', type: '공통변경', date: '2025-04-15', author: '최개발', status: '대기' },
            { id: '005', title: '[대시보드] KPI 위젯 오류 수정', type: '오류수정', date: '2025-04-14', author: '김개발', status: '진행중' },
        ];

        // --- 공통 배지 컴포넌트 ---

            const [view, setView] = useState('list');

                    <div className="flex bg-slate-100 p-1 rounded-md ml-4">

                        <button className="px-4 py-1.5 text-slate-600 text-sm font-medium rounded hover:bg-slate-200 transition">진행중</button>
                    </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">

                            <th className="px-6 py-3 font-medium">No.</th>
                            <th className="px-6 py-3 font-medium">폴더 타이틀</th>
                            <th className="px-6 py-3 font-medium">요청 유형</th>
                            <th className="px-6 py-3 font-medium">요청일</th>
                            <th className="px-6 py-3 font-medium">담당자</th>
                            <th className="px-6 py-3 font-medium">상태</th>

                        </thead>
                        <tbody className="divide-y divide-slate-100">
                        {MOCK_FOLDERS.map((f) => (

                            </td>
                            <td className="px-6 py-4 text-slate-500">{f.date}</td>
                            <td className="px-6 py-4 text-slate-800">{f.author}</td>
                            <td className="px-6 py-4">
                                <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                f.status === '진행중' ? 'bg-blue-100 text-blue-700' :
                                f.status === '완료' ? 'bg-green-100 text-green-700' :
                                f.status === '검토중' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-700'
                                }`}>{f.status}</span>
                            </td>
                            </tr>
                        ))}
                        </tbody>
                    </table>
                    </div>
                </div>

                {/* FR-01: 자동 타이틀 생성 패널 (바텀 시트) */}

                        <FRBadge code="FR-01" />
                    </div>
                    <div className="p-6">
                        <label className="block text-sm text-slate-600 mb-2">요청 내용 입력</label>
                        <textarea

                        ></textarea>
                        
                        <label className="block text-sm text-slate-600 mb-2">AI 자동 생성 타이틀 후보</label>
                        <div className="flex space-x-6 mb-6">
                        <label className="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="title" defaultChecked className="w-4 h-4 text-blue-600 focus:ring-blue-500" />
                            <span className="text-slate-800 font-medium">[로그인] 세션 만료 후 새로고침 오류 수정</span>
                        </label>
                        <label className="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="title" className="w-4 h-4 text-blue-600 focus:ring-blue-500" />
                            <span className="text-slate-800 font-medium">[인증] 세션 처리 오류 수정 요청</span>
                        </label>
                        </div>
                        
                        <div className="flex space-x-3">
                        <button 
                            onClick={() => { setShowFr01Panel(false); setView('similar_search'); }} 
                            className="px-6 py-2.5 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700 transition"
                        >이 타이틀로 확정</button>
                        <button onClick={() => setShowFr01Panel(false)} className="px-6 py-2.5 border border-slate-300 text-slate-600 rounded-md hover:bg-slate-50 transition">직접 입력</button>
                        </div>
                    </div>
                    </div>
                )}
                </div>
            );

            // --- 화면 1.5 [FR-08] 신규 요청 등록 > 유사 이력 자동 탐색 ---
            const SimilarSearchView = () => (
                <div className="p-6 max-w-6xl mx-auto">
                <div className="flex items-center text-sm text-slate-500 mb-6">
                    <span className="cursor-pointer hover:text-blue-600 transition" onClick={() => setView('list')}>작업폴더 목록</span> <ChevronRight className="w-4 h-4 mx-1" />
                    <span>신규 요청 등록</span> <ChevronRight className="w-4 h-4 mx-1" />

                </div>

                <div className="bg-blue-50/50 border border-blue-100 rounded-lg p-4 mb-6">
                    <div className="flex items-center text-sm mb-2">

                    <div className="flex space-x-2">
                        <span className="px-3 py-1 bg-white border border-blue-200 text-blue-700 rounded-full text-xs">세션 만료</span>
                        <span className="px-3 py-1 bg-white border border-blue-200 text-blue-700 rounded-full text-xs">로그인 오류</span>
                        <span className="px-3 py-1 bg-white border border-blue-200 text-blue-700 rounded-full text-xs">redirect 처리</span>
                    </div>

                    <p className="text-sm text-blue-800 font-medium">3건의 유사 요청 이력이 발견되었습니다.</p>
                </div>

                <div className="space-y-4 mb-8">

                    { score: 92, id: 'WRK-0241', sys: '구매관리 시스템', title: '[구매관리] 세션 만료 redirect 오류 수정', date: '2024-11-10' },
                    { score: 87, id: 'WRK-0189', sys: '인사관리 시스템', title: '[인사관리] 로그인 세션 처리 오류', date: '2024-08-22' },
                    { score: 78, id: 'WRK-0312', sys: '공통 모듈', title: '[공통] 인증 필터 500 오류 수정', date: '2025-01-05' }

                        <div className="flex flex-col items-center justify-center w-16 border-r border-slate-100 mr-4 pr-4">
                            <span className="text-2xl font-bold text-green-600">{item.score}</span>
                            <span className="text-[10px] text-slate-400 mt-1">% 유사도</span>
                        </div>
                        <div>
                            <div className="flex items-center text-xs text-slate-400 mb-1">
                            <span>{item.id}</span> <span className="mx-2">·</span> <span>{item.sys}</span>
                            </div>
                            <h4 className="text-base font-medium text-blue-700 hover:underline cursor-pointer">{item.title}</h4>
                            <div className="flex items-center text-xs text-slate-500 mt-2">

                        </div>
                        <div className="flex space-x-2">

                    '작업노트 참조' 버튼으로 해결 방안을 불러올 수 있습니다.
                    </p>
                </div>

                <div className="flex space-x-3">

            // --- 화면 2. [FR-02] 작업폴더 상세 > 요정 내용 1차 정리 ---

                <div className="grid grid-cols-2 gap-6 mb-6">

                    <h3 className="text-sm font-semibold text-slate-500 mb-4">요청 유형 분류</h3>
                    <div className="space-y-3">
                        <label className="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" name="reqType" defaultChecked className="w-4 h-4 text-blue-600" />
                        <span className="text-sm text-slate-800 font-medium">오류수정 (Bug Fix)</span>

                        <input type="radio" name="reqType" className="w-4 h-4 text-blue-600" />
