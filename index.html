<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업노트 요청 게시판 (Intranet SPA)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind Config for Intranet Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        intra: {
                            bg: '#eef5f9',
                            text: '#455a64',
                            primary: '#1e88e5',
                            primaryDark: '#1565c0',
                            border: '#dae4ec',
                            mint: '#26c6da',
                            orange: '#ff6200',
                            tableHead: '#f1f8fc'
                        }
                    },
                    fontFamily: {
                        sans: ['"Malgun Gothic"', 'Pretendard', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Malgun Gothic', 'Pretendard', sans-serif !important;
            background-color: #eef5f9;
            color: #455a64;
            letter-spacing: -0.5px;
            overflow: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .chart-container {
            position: relative;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- Chosen Palette: Intranet Blue (#1e88e5, #eef5f9, #455a64) -->
    <!-- Application Structure Plan: The SPA features an Intranet layout. Folder list and Note list tables have been updated to prevent 2-line text wrapping using whitespace-nowrap and min-width techniques. The AI Sub-note creation has been migrated from a bottom sliding panel to a centered Modal popup to improve focus and UX. Split-Pane view is maintained for efficient note editing. The Manager's Response section has been updated to follow an AS-IS to TO-BE format with a friendly tone. -->
    <!-- Visualization & Content Choices: 
         - Modal for Folders & Notes: HTML fixed overlay (Goal: Organize/Inform). Clear, focused manual and AI inputs.
         - Split Pane Editor: Flexbox (Goal: Change). Allows referencing AI while authoring final text. Left pane includes full WYSIWYG editor UI for note content.
         - Data Tables: whitespace-nowrap applied (Goal: Inform). Clean layout on standard desktop resolutions.
         - Formatted AS-IS/TO-BE Response: Clear typography and background colors to distinguish the before and after states for non-technical managers. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. All icons are Unicode. -->

    <div id="app" class="h-screen w-full flex flex-col font-sans bg-intra-bg overflow-hidden"></div>

    <script>
        // --- 1. State Management ---
        const state = {
            view: 'list', // 'list', 'similar_search', 'folder_detail', 'note_create_split', 'note_detail_view', 'my_tasks', 'dashboard'
            activeMenu: '작업목록조회', 
            showNewFolderModal: false, // For manual folder creation
            showNewNoteModal: false, // Repurposed: Modal for AI Sub-note title creation
            expandedFolderId: null,
            createTab: 'cause', 
            detailTab: 'answer', 
            answerType: 'easy', // 수정: 탭 순서 변경에 따라 기본값을 'easy'로 설정
            solutionTab: '1안',
            taskFilter: '전체',
            dateFilter: '이번달',
            folderFilter: '전체',
            editModeFr06: false // Tracks if the Manager Answer is in edit mode
        };

        // --- 2. Helper Functions ---
        const getStatusStyle = (status) => {
            switch(status) {
                case '검토중': return 'bg-yellow-100 text-yellow-700 border border-yellow-200';
                case '작업중': return 'bg-red-100 text-red-700 border border-red-200';
                case '검수중': return 'bg-blue-100 text-intra-primary border border-blue-200';
                case '작업완료': return 'bg-gray-200 text-gray-700 border border-gray-300';
                default: return 'bg-gray-100 text-gray-600 border border-gray-200';
            }
        };

        // --- 3. Mock Data ---
        const MOCK_FOLDERS = [
            { 
                id: 'F-001', title: '[로그인] 세션 만료 오류 수정 요청', type: '오류수정', date: '2026-04-18', author: '김개발', status: '작업중', univ: 'A대학',
                notes: [
                    { id: 'N-001-1', title: '세션 만료 예외 처리 로직 추가', period: '26.04.18 ~ 04.20', est: '2h', actual: '2.5h', status: '작업중', assignee: '김개발' },
                    { id: 'N-001-2', title: '로그인 화면 UI 타임아웃 팝업 연동', period: '26.04.19 ~ 04.21', est: '1h', actual: '-', status: '검토중', assignee: '이프론트' }
                ]
            },
            { 
                id: 'F-002', title: '[매출현황] 월별 집계 기능 개선 요청', type: '기능개선', date: '2026-04-17', author: '이기획', status: '작업완료', univ: 'B대학',
                notes: [
                    { id: 'N-002-1', title: '월별 집계 쿼리 튜닝 및 인덱스 추가', period: '26.04.17 ~ 04.18', est: '4h', actual: '3h', status: '작업완료', assignee: '박디비' }
                ]
            },
            { 
                id: 'F-003', title: '[회원관리] 신규 탈퇴 사유 항목 추가', type: '신규구축', date: '2026-04-16', author: '박운영', status: '검토중', univ: 'C대학',
                notes: []
            }
        ];

        const MOCK_MY_TASKS = [
            { id: 'N-001-1', title: '[로그인] 세션 만료 예외 처리', univ: 'A대학', type: '오류수정', period: '04-18 ~ 04-21', estTime: '3h', actTime: '3.5h', author: '김개발', status: '작업중', progress: 60, statusColor: 'bg-red-100 text-red-700' },
            { id: 'N-102-3', title: '[수강신청] 취소버튼 500 오류', univ: 'B대학', type: '오류수정', period: '04-17 ~ 04-20', estTime: '2h', actTime: '1h', author: '김개발', status: '검수중', progress: 90, statusColor: 'bg-blue-100 text-intra-primary' },
            { id: 'N-204-1', title: '[성적조회] PDF 출력 레이아웃', univ: 'A대학', type: '기능개선', period: '04-15 ~ 04-18', estTime: '8h', actTime: '8h', author: '김개발', status: '작업완료', progress: 100, statusColor: 'bg-gray-200 text-gray-700' },
            { id: 'N-305-2', title: '[공지사항] 첨부파일 업로드 오류', univ: 'C대학', type: '오류수정', period: '04-14 ~ 04-17', estTime: '4h', actTime: '5h', author: '김개발', status: '작업중', progress: 80, statusColor: 'bg-red-100 text-red-700', isOverdue: true },
        ];

        let barChartInstance = null;
        let donutChartInstance = null;

        // --- 4. View Builders ---

        const getBadge = (code) => `<span class="inline-flex items-center px-2 py-0.5 rounded-[8px] text-[11px] font-bold bg-[#e8f0fe] text-intra-primary ml-2 border border-[#b8d4fe]">FR-${code}</span>`;

        const buildHeader = () => `
            <header class="h-16 bg-intra-primary text-white flex items-center px-6 justify-between shrink-0 shadow-sm relative z-30">
                <div class="flex items-center space-x-8">
                    <h1 class="text-lg font-bold flex items-center tracking-tight cursor-pointer" data-action="nav" data-view="list" data-menu="작업목록조회">
                        📋 내부 업무 요청 게시판 <span class="ml-3 px-2 py-0.5 bg-white/20 text-white text-[10px] rounded">v1.8</span>
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-sm font-bold text-white/90 mr-2 border-r border-white/30 pr-4">👤 김개발 님</div>
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-sm font-bold shadow-none cursor-pointer hover:bg-white/30 transition">K</div>
                </div>
            </header>
        `;

        const buildSidebar = () => `
            <aside class="w-64 bg-white border-r border-intra-border flex flex-col shrink-0 overflow-y-auto relative z-20">
                <div class="p-4 border-b border-intra-border/50">
                    <h2 class="text-xs font-bold text-intra-text/50 mb-3 tracking-wider ml-2">MYBOX</h2>
                    <ul class="space-y-1">
                        <li>
                            <button data-action="nav" data-view="list" data-menu="작업목록조회" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === '작업목록조회' ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                📁 전체 #작업목록조회
                            </button>
                        </li>
                        <li>
                            <button data-action="nav" data-view="my_tasks" data-menu="마이페이지" class="w-full flex flex-col items-start px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === '마이페이지' ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                <div class="flex items-center">
                                    👤 전체 #마이페이지
                                </div>
                                <span class="text-[10px] mt-1.5 ml-6 text-left ${state.activeMenu === '마이페이지' ? 'text-intra-primary/70' : 'text-intra-text/50'}">내가 등록/할당된 내역</span>
                            </button>
                        </li>
                        <li>
                            <button data-action="nav" data-view="dashboard" data-menu="작업피드" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === '작업피드' ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                📊 전체 #내 작업피드
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="p-4">
                    <div class="flex justify-between items-center mb-3 ml-2 pr-2">
                        <h2 class="text-xs font-bold text-intra-text/50 tracking-wider">대학별 폴더</h2>
                        <span class="text-intra-text/50 cursor-pointer hover:text-intra-primary" title="폴더 추가">➕</span>
                    </div>
                    <ul class="space-y-1">
                        ${['A대학', 'B대학', 'C대학'].map(uni => `
                            <li>
                                <button data-action="nav" data-view="list" data-menu="${uni}" class="w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${state.activeMenu === uni ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}">
                                    <div class="w-1.5 h-1.5 rounded-full mr-3 ${state.activeMenu === uni ? 'bg-intra-primary' : 'bg-intra-border'}"></div>
                                    ${uni}
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            </aside>
        `;

        const buildListView = () => {
            const isUnivFilter = ['A대학', 'B대학', 'C대학'].includes(state.activeMenu);
            const filteredList = isUnivFilter ? MOCK_FOLDERS.filter(f => f.univ === state.activeMenu) : MOCK_FOLDERS;

            return `
                <div class="flex flex-col h-full relative">
                    <div class="p-6 flex-1 pb-32 overflow-y-auto">
                        <div class="mb-4">
                            <h2 class="text-xl font-bold text-intra-text mb-2">작업폴더 및 노트 목록</h2>
                            <p class="text-sm text-intra-text/80">ℹ️ 폴더를 클릭하여 하위 작업노트 목록을 펼치고 상세 내역을 관리할 수 있습니다.</p>
                        </div>
                        <div class="bg-white rounded-[5px] shadow-none border border-intra-border p-4 mb-6 flex items-center space-x-4">
                            <div class="flex-1 relative flex items-center border border-intra-border rounded-[5px] px-3 bg-white focus-within:ring-1 focus-within:ring-intra-primary focus-within:border-intra-primary">
                                <span class="text-intra-text/50 text-sm">🔍</span>
                                <input type="text" placeholder="요청 내용으로 검색..." class="w-full pl-2 py-2 outline-none text-sm bg-transparent" />
                            </div>
                            <button class="px-6 py-2 bg-intra-primary text-white rounded-[5px] font-medium hover:bg-intra-primaryDark transition text-sm">검색</button>
                            
                            <button data-action="toggle" data-key="showNewFolderModal" data-val="true" class="px-6 py-2 bg-white border border-intra-border text-intra-text rounded-[5px] font-medium hover:bg-gray-50 flex items-center transition text-sm">
                                ➕ 새 폴더 등록
                            </button>
                        </div>

                        <div class="bg-white rounded-[5px] shadow-none border border-intra-border overflow-hidden">
                            <div class="bg-gray-50 border-b border-intra-border px-4 py-3 flex items-center justify-between">
                                <h3 class="font-bold text-intra-text flex items-center">
                                    ${isUnivFilter ? `[${state.activeMenu}] 소속 작업목록` : '전체 작업목록'}
                                    <span class="ml-2 bg-white px-2 py-0.5 rounded border border-intra-border text-intra-primary text-xs">${filteredList.length}건</span>
                                </h3>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm min-w-max">
                                    <thead class="bg-intra-tableHead text-intra-text border-b border-intra-border">
                                    <tr>
                                        <th class="px-4 py-3 font-medium text-center border-r border-white whitespace-nowrap">No.</th>
                                        <th class="px-4 py-3 font-medium border-r border-white min-w-[200px] whitespace-nowrap">폴더 타이틀</th>
                                        <th class="px-4 py-3 font-medium border-r border-white text-center whitespace-nowrap">대학 구분</th>
                                        <th class="px-4 py-3 font-medium border-r border-white text-center whitespace-nowrap">요청 유형</th>
                                        <th class="px-4 py-3 font-medium border-r border-white text-center whitespace-nowrap">요청일</th>
                                        <th class="px-4 py-3 font-medium border-r border-white text-center whitespace-nowrap">담당자</th>
                                        <th class="px-4 py-3 font-medium text-center whitespace-nowrap">상태</th>
                                    </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                    ${filteredList.length > 0 ? filteredList.map((f) => `
                                        <tr data-action="toggleFolder" data-id="${f.id}" class="hover:bg-[#f1f8fc] cursor-pointer transition ${state.expandedFolderId === f.id ? 'bg-[#f1f8fc]' : ''}">
                                            <td class="px-4 py-4 text-intra-text/60 text-center font-mono whitespace-nowrap">${f.id}</td>
                                            <td class="px-4 py-4 font-bold text-intra-primary flex items-center whitespace-nowrap">
                                                <span class="mr-2">${state.expandedFolderId === f.id ? '📂' : '📁'}</span> ${f.title}
                                            </td>
                                            <td class="px-4 py-4 text-center text-intra-text/80 text-xs whitespace-nowrap">${f.univ}</td>
                                            <td class="px-4 py-4 text-center whitespace-nowrap"><span class="px-2 py-1 bg-gray-100 text-intra-text rounded-[5px] text-xs">${f.type}</span></td>
                                            <td class="px-4 py-4 text-intra-text/70 text-center whitespace-nowrap">${f.date}</td>
                                            <td class="px-4 py-4 text-intra-text text-center whitespace-nowrap">${f.author}</td>
                                            <td class="px-4 py-4 text-center whitespace-nowrap">
                                                <span class="px-2 py-1 rounded-[5px] text-xs font-bold ${getStatusStyle(f.status)}">${f.status}</span>
                                            </td>
                                        </tr>
                                        ${state.expandedFolderId === f.id ? `
                                        <tr class="bg-intra-bg border-b-2 border-intra-primary/30">
                                            <td colspan="7" class="p-6">
                                                <div class="bg-white border border-intra-border rounded-[5px] shadow-sm overflow-hidden">
                                                    <div class="bg-gray-50 px-4 py-3 border-b border-intra-border flex justify-between items-center">
                                                        <h4 class="font-bold text-intra-text text-sm flex items-center">↳ 하위 작업노트 목록</h4>
                                                        <button data-action="toggle" data-key="showNewNoteModal" data-val="true" class="text-xs bg-intra-primary text-white px-3 py-1.5 rounded-[3px] hover:bg-intra-primaryDark transition font-bold shadow-sm">➕ 노트 추가</button>
                                                    </div>
                                                    ${f.notes && f.notes.length > 0 ? `
                                                    <div class="overflow-x-auto">
                                                        <table class="w-full text-xs text-left min-w-max">
                                                            <thead class="bg-white border-b border-intra-border text-intra-text/70">
                                                                <tr>
                                                                    <th class="py-2 px-4 font-medium whitespace-nowrap text-center">노트 ID</th>
                                                                    <th class="py-2 px-4 font-medium whitespace-nowrap">노트 제목</th>
                                                                    <th class="py-2 px-4 font-medium text-center whitespace-nowrap">요청기간</th>
                                                                    <th class="py-2 px-4 font-medium text-center whitespace-nowrap">예상 공수</th>
                                                                    <th class="py-2 px-4 font-medium text-center whitespace-nowrap">실제 공수</th>
                                                                    <th class="py-2 px-4 font-medium text-center whitespace-nowrap">담당자</th>
                                                                    <th class="py-2 px-4 font-medium text-center whitespace-nowrap">상태</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody class="divide-y divide-gray-100">
                                                                ${f.notes.map(n => `
                                                                    <tr class="hover:bg-blue-50 cursor-pointer transition group" data-action="nav" data-view="note_detail_view">
                                                                        <td class="py-3 px-4 font-mono text-intra-primary group-hover:underline text-center whitespace-nowrap">${n.id}</td>
                                                                        <td class="py-3 px-4 font-bold whitespace-nowrap">${n.title}</td>
                                                                        <td class="py-3 px-4 text-center font-mono text-intra-text/70 whitespace-nowrap">${n.period}</td>
                                                                        <td class="py-3 px-4 text-center text-intra-text/70 whitespace-nowrap">${n.est}</td>
                                                                        <td class="py-3 px-4 text-center font-bold whitespace-nowrap">${n.actual}</td>
                                                                        <td class="py-3 px-4 text-center whitespace-nowrap">${n.assignee}</td>
                                                                        <td class="py-3 px-4 text-center whitespace-nowrap">
                                                                            <span class="px-2 py-0.5 rounded-[3px] text-[10px] font-bold ${getStatusStyle(n.status)}">${n.status}</span>
                                                                        </td>
                                                                    </tr>
                                                                `).join('')}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                    ` : `<div class="p-6 text-center text-sm text-intra-text/50 bg-white">등록된 하위 작업노트가 없습니다. 우측 상단의 '노트 추가' 버튼을 눌러 작업을 배정하세요.</div>`}
                                                </div>
                                            </td>
                                        </tr>
                                        ` : ''}
                                    `).join('') : `<tr><td colspan="7" class="px-6 py-12 text-center text-intra-text/50">조회된 내역이 없습니다.</td></tr>`}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Manual New Folder Modal -->
                    ${state.showNewFolderModal ? `
                        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-[5px] p-6 w-full max-w-[400px] shadow-lg border border-intra-border flex flex-col">
                                <h3 class="font-bold text-lg mb-4 text-intra-text flex items-center">📁 새 폴더 등록</h3>
                                <label class="block text-sm font-bold text-intra-text mb-2">폴더명 입력 (기획자 직접 지정)</label>
                                <input type="text" class="w-full border border-intra-border rounded-[3px] p-2.5 text-sm outline-none focus:border-intra-primary mb-6 bg-gray-50" placeholder="예: [학사관리] 수강신청 오류 관련">
                                <div class="flex justify-end space-x-2 mt-auto">
                                    <button data-action="toggle" data-key="showNewFolderModal" data-val="false" class="px-4 py-2 border border-intra-border rounded-[3px] text-sm hover:bg-gray-50 font-bold text-intra-text transition">취소</button>
                                    <button data-action="toggle" data-key="showNewFolderModal" data-val="false" class="px-4 py-2 bg-intra-primary text-white rounded-[3px] text-sm hover:bg-intra-primaryDark font-bold transition">폴더 등록</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Note Creation Modal -->
                    ${state.showNewNoteModal ? `
                        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-[5px] p-0 w-full max-w-[550px] shadow-lg border border-intra-border flex flex-col overflow-hidden max-h-[90vh]">
                                <div class="bg-intra-primary text-white px-6 py-4 flex justify-between items-center">
                                    <h3 class="font-bold flex items-center text-lg">✨ 새 작업노트 타이틀 생성 (AI)</h3>
                                    ${getBadge('01')}

                                            <div>
                                                <h4 class="font-bold text-intra-primary flex items-center mb-1"><span class="w-1.5 h-1.5 bg-intra-primary mr-2 rounded-full"></span> 메뉴 경로</h4>
                                                <p class="pl-4 text-intra-text/80">공통모듈 > 로그인</p>
                                            </div>
                                            <div>
                                                <h4 class="font-bold text-intra-primary flex items-center mb-1"><span class="w-1.5 h-1.5 bg-intra-primary mr-2 rounded-full"></span> 기존에는 어땠나요? (AS-IS)</h4>
                                                <p class="pl-4 text-intra-text/80">일정 시간(30분)이 지나 로그인이 풀렸을 때 화면을 새로고침하면, 오류 창이나 빈 화면이 나타나 이용에 불편함이 있으셨습니다.</p>
                                            </div>
                                            <div>
                                                <h4 class="font-bold text-intra-primary flex items-center mb-1"><span class="w-1.5 h-1.5 bg-intra-primary mr-2 rounded-full"></span> 어떻게 수정되었나요? (TO-BE)</h4>
                                                <p class="pl-4 bg-gray-50 p-3 border-l-[3px] border-intra-border rounded text-intra-text">이제는 세션이 만료된 상태에서 새로고침을 하더라도 오류 화면 대신 <b>'로그인 화면'으로 자연스럽게 다시 이동</b>하도록 수정되었습니다. 평소처럼 편리하게 다시 로그인하여 이용하실 수 있습니다!</p>
                                            </div>
                                        </div>
                                        <p class="mt-5">확인 후 검수완료 부탁드립니다.<br>감사합니다.</p>
                                    </div>
                                `}
                            </div>

                            <!-- 버튼 영역 -->
                            <div class="mt-8 flex space-x-3">
                                ${state.editModeFr06 ? `
                                    <button data-action="set" data-key="editModeFr06" data-val="false" class="px-6 py-2.5 bg-intra-primary text-white font-bold rounded-[5px] hover:bg-intra-primaryDark transition flex items-center">
                                        💾 편집 내용 저장
                                    </button>
                                    <!-- 수정됨: 편집 취소 버튼 추가 -->
                                    <button data-action="set" data-key="editModeFr06" data-val="false" class="px-6 py-2.5 border border-intra-border bg-white text-intra-text font-bold rounded-[5px] hover:bg-gray-50 transition flex items-center">
                                        취소
                                    </button>
                                ` : ``}
                            </div>
                        </div>
                    `}
                ` : `
                    <div class="bg-[#fff3e0] border border-[#ffe0b2] rounded-[5px] p-4 flex items-start text-[#ff6200] text-sm shadow-sm">
                        <p class="font-bold">⚠️ 수정된 내용과 연관된 매뉴얼 2건이 업데이트가 필요합니다. 직접 매뉴얼 시스템에 등록해주세요.</p>
                    </div>
                `}
            </div>
        `;

        const buildMyTasks = () => {
            const filteredTasks = state.taskFilter === '전체' ? MOCK_MY_TASKS : MOCK_MY_TASKS.filter(t => state.taskFilter === '지연' ? t.isOverdue : t.status === state.taskFilter);
            return `
            <div class="p-6 max-w-7xl mx-auto pb-32 overflow-y-auto h-full">
                <div class="mb-4">
                    <h2 class="text-xl font-bold text-intra-text mb-2">나의 작업 목록 (마이페이지)</h2>
                    <p class="text-sm text-intra-text/80">ℹ️ 내가 담당하는 작업노트들의 세부 공수 및 진행 상태를 모니터링합니다.</p>
                </div>

                <div class="bg-white border border-intra-border rounded-[5px] shadow-none overflow-hidden mt-6">
                    <div class="p-4 border-b border-intra-border flex items-center justify-between bg-[#f8f9fa]">
                        <div class="flex items-center space-x-4">
                            <span class="font-bold text-intra-text">상태 필터:</span>
                            <div class="flex bg-white border border-intra-border p-1 rounded-[5px]">
                                ${['전체', '검토중', '작업중', '검수중', '작업완료'].map(f => `
                                    <button data-action="set" data-key="taskFilter" data-val="${f}" class="px-4 py-1 text-sm font-bold rounded-[3px] transition ${state.taskFilter === f ? 'bg-intra-primary text-white' : 'text-intra-text hover:bg-gray-100'}">${f}</button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-intra-tableHead text-intra-text border-b border-intra-border">
                            <tr>
                                <th class="px-4 py-3 font-medium border-r border-white">작업노트 제목</th>
                                <th class="px-4 py-3 font-medium border-r border-white text-center">대학 구분</th>
                                <th class="px-4 py-3 font-medium border-r border-white text-center">요청 유형</th>
                                <th class="px-4 py-3 font-medium border-r border-white text-center">요청기간</th>
                                <th class="px-4 py-3 font-medium border-r border-white text-center">예상 소요</th>
                                <th class="px-4 py-3 font-medium border-r border-white text-center text-intra-primary">실제 소요</th>
                                <th class="px-4 py-3 font-medium border-r border-white text-center">담당자</th>
                                <th class="px-4 py-3 font-medium text-center w-24">상태</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            ${filteredTasks.map(task => `
                                <tr data-action="nav" data-view="note_detail_view" class="hover:bg-[#f1f8fc] transition cursor-pointer">
                                    <td class="px-4 py-4 font-bold text-intra-primary">${task.title}</td>
                                    <td class="px-4 py-4 text-center text-xs">${task.univ}</td>
                                    <td class="px-4 py-4 text-center"><span class="px-2 py-1 bg-gray-100 rounded-[3px] text-[10px]">${task.type}</span></td>
                                    <td class="px-4 py-4 text-center text-xs font-mono">${task.period}</td>
                                    <td class="px-4 py-4 text-center text-xs">${task.estTime}</td>
                                    <td class="px-4 py-4 text-center text-xs font-bold text-intra-primary">${task.actTime}</td>
                                    <td class="px-4 py-4 text-center text-xs">${task.author}</td>
                                    <td class="px-4 py-4 text-center">
                                        <span class="px-2 py-1 rounded-[5px] text-[11px] font-bold ${getStatusStyle(task.status)}">${task.status}</span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
        };

        const buildDashboard = () => `
            <div class="p-6 max-w-7xl mx-auto pb-32 overflow-y-auto w-full h-full">
                <div class="mb-4">
                    <h2 class="text-xl font-bold text-intra-text mb-2">통계/현황 조회 대시보드</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div class="bg-white border border-intra-border rounded-[5px] p-6 shadow-none flex flex-col">
                        <h3 class="text-lg font-bold text-intra-text mb-6 flex items-center border-l-[3px] border-intra-primary pl-3">A. 자주 발생하는 오류 유형 (Bar)</h3>
                        <div class="chart-container flex-1 w-full max-w-xl mx-auto h-[300px] min-h-[300px]">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white border border-intra-border rounded-[5px] p-6 shadow-none flex flex-col">
                        <h3 class="text-lg font-bold text-intra-text mb-6 flex items-center border-l-[3px] border-intra-primary pl-3">B. 오류 발생 비율 (Doughnut)</h3>
                        <div class="chart-container flex-1 w-full max-w-sm mx-auto h-[300px] min-h-[300px]">
                            <canvas id="donutChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // --- 5. Main Render Function ---
        const render = () => {
            const app = document.getElementById('app');
            
            let mainContent = '';
            switch(state.view) {
                case 'list': mainContent = buildListView(); break;
                case 'similar_search': mainContent = buildSimilarSearch(); break;
                case 'note_create_split': mainContent = buildNoteCreateSplit(); break;
                case 'note_detail_view': mainContent = buildNoteDetailView(); break;
                case 'my_tasks': mainContent = buildMyTasks(); break;
                case 'dashboard': mainContent = buildDashboard(); break;
                default: mainContent = buildListView(); break;
            }

            app.innerHTML = `
                ${buildHeader()}
                <div class="flex-1 flex overflow-hidden">
                    ${buildSidebar()}
                    <main class="flex-1 overflow-hidden relative bg-intra-bg flex flex-col">
                        ${mainContent}
                    </main>
                </div>
            `;

            if (state.view === 'dashboard') {
                setTimeout(initCharts, 0); 
            }
        };

        // --- 6. Chart.js Initialization ---
        const initCharts = () => {
            if (barChartInstance) barChartInstance.destroy();
            if (donutChartInstance) donutChartInstance.destroy();

            const barCtx = document.getElementById('barChart');
            const donutCtx = document.getElementById('donutChart');

            if (barCtx) {
                barChartInstance = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: ['세션/인증 오류', '파일 업로드 오류', 'DB 조회 오류', 'UI 렌더링 오류', 'API 연동 오류'],
                        datasets: [{
                            label: '오류 건수',
                            data: [52, 38, 31, 24, 18],
                            backgroundColor: ['#1e88e5', '#60a5fa', '#26c6da', '#ff6200', '#eab308']
                        }]
                    },
                    options: { indexAxis: 'y', maintainAspectRatio: false, responsive: true, plugins: { legend: { display: false } } }
                });
            }

            if (donutCtx) {
                donutChartInstance = new Chart(donutCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['세션/인증', '파일업로드', 'DB/인프라', '기타'],
                        datasets: [{
                            data: [52, 38, 31, 57],
                            backgroundColor: ['#1e88e5', '#60a5fa', '#26c6da', '#ff6200']
                        }]
                    },
                    options: { maintainAspectRatio: false, responsive: true, cutout: '70%', plugins: { legend: { position: 'bottom' } } }
                });
            }
        };

        // --- 7. Event Delegation ---
        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;

            const action = btn.dataset.action;
            
            if (action === 'nav') {
                state.view = btn.dataset.view;
                if (btn.dataset.menu) state.activeMenu = btn.dataset.menu;
                render();
            } else if (action === 'navAndCloseNoteModal') {
                state.view = btn.dataset.view;
                state.showNewNoteModal = false;
                render();
            } else if (action === 'toggle') {
                state[btn.dataset.key] = btn.dataset.val === 'true';
                render();
            } else if (action === 'set') {
                state[btn.dataset.key] = btn.dataset.val === 'true' ? true : btn.dataset.val === 'false' ? false : btn.dataset.val;
                render();
            } else if (action === 'toggleFolder') {
                const folderId = btn.dataset.id;
                state.expandedFolderId = state.expandedFolderId === folderId ? null : folderId;
                render();
            }
        });

        // Initial Render
        render();

    </script>
</body>
</html>
