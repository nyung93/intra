                                            전체 #내 작업피드
                                        </button>
                                    </li>
                                </ul>
                            </div>
                            
                            {/* 대학별 폴더 그룹 */}
                            <div className="p-4">
                                <div className="flex justify-between items-center mb-3 ml-2 pr-2">
                                    <h2 className="text-xs font-bold text-intra-text/50 tracking-wider">대학별 폴더</h2>
                                    <Plus className="w-3.5 h-3.5 text-intra-text/50 cursor-pointer hover:text-intra-primary" title="대학 폴더 추가" />
                                </div>
                                <ul className="space-y-1">
                                    {['A대학', 'B대학', 'C대학'].map(uni => (
                                        <li key={uni}>
                                            <button 
                                                onClick={() => handleMenuClick(uni, 'list')} 
                                                className={`w-full flex items-center px-3 py-2.5 rounded-[5px] text-sm transition ${activeMenu === uni ? 'bg-[#f1f8fc] text-intra-primary font-bold' : 'text-intra-text hover:bg-gray-50 font-medium'}`}
                                            >
                                                <div className={`w-1.5 h-1.5 rounded-full mr-3 ${activeMenu === uni ? 'bg-intra-primary' : 'bg-intra-border'}`}></div>
                                                {uni}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </aside>

                        {/* Main Content Area */}
                        <main className="flex-1 overflow-y-auto relative bg-intra-bg">
                            {view === 'list' && <FolderListView />}
                            {view === 'similar_search' && <SimilarSearchView />}
                            {view === 'folder_detail' && <FolderDetailView />}
                            {view === 'task_form' && <TaskNoteFormView />}
                            {view === 'note_create' && <NoteCreateView />}
                            {view === 'note_detail' && <NoteDetailView />}
                            {view === 'my_tasks' && <MyTasksView />}
                            {view === 'dashboard' && <DashboardView />}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InternalRequestBoard />);
    </script>
</body>
</html>
